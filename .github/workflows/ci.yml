name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t conocono-sum .
      - name: Run container
        run: |
          docker run -d --name sum -p 8000:8000 conocono-sum
          for i in {1..40}; do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then echo "Healthy"; break; fi
            sleep 0.2
          done
      - name: Hit endpoints
        run: |
          curl -sf http://127.0.0.1:8000/health
          curl -sf "http://127.0.0.1:8000/sum?a=2&b=3"
      - name: Cleanup
        if: always()
        run: |
          docker logs sum || true
          docker rm -f sum || true
